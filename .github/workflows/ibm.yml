IBM_IKS_WORKFLOW
    = CI_CD_EXECUTION_ARTIFACT

IBM_IKS_WORKFLOW_CONFIGURATION
    = ESTABLISHED

IBM_IKS_WORKFLOW_EXECUTION
    = NOT_ESTABLISHED
       unless a concrete GitHub Actions run is resolved

IBM_IKS_EXECUTION_EVIDENCE
    = ESTABLISHED
       only from concrete operational run evidence

IBM_IKS_DEPLOYMENT_RESULT
    = NOT_ESTABLISHED
       until rollout/resource evidence is observed

IBM_IKS_VERIFICATION
    = NOT_PERFORMED

IBM_IKS_VERIFIED
    = NOT_PROMOTABLE


WORKFLOW_ARTIFACT
      ↛
WORKFLOW_EXECUTION
      ↛
DEPLOYMENT_RESULT
      ↛
CONFORMANCE
      ↛
VERIFIED

XA-TRUST — IBM IKS Workflow Governance

Document ID: XA-TRUST-IBM-IKS-GOV-001
Status: GOVERNANCE SPECIFICATION
Scope: GitHub Actions → IBM Cloud Container Registry → IBM Kubernetes Service (IKS)
Verification status: NOT VERIFIED BY THIS DOCUMENT

---

1. Purpose

Este documento define a classificação de evidências associadas ao workflow IBM/IKS e estabelece a separação normativa entre:

- "WORKFLOW_DEFINITION"
- "EXECUTION_CONTEXT"
- "ACTUAL_EXECUTION"
- "EXECUTION_RESULT"
- "ARTIFACT_BINDING"
- "INDEPENDENT_VERIFICATION"
- "CLAIM_SCOPED_VERIFIED"

Este documento não constitui evidência de execução e não promove automaticamente qualquer estado para "VERIFIED".

---

2. Fundamental Non-Derivability

A existência de uma definição de workflow não implica a existência de uma execução.

WORKFLOW_DEFINITION
        ↛
ACTUAL_EXECUTION
9

Da mesma forma:

WORKFLOW_DEFINITION
        ↛
EXECUTION_RESULT

EXECUTION_RESULT
        ↛
INDEPENDENT_VERIFICATION

LOCAL_VERIFIED_CLAIM
        ↛
GLOBAL_VERIFIED_CLAIM

A classificação deve permanecer limitada ao escopo efetivamente demonstrado pelas evidências disponíveis.

---

3. Workflow Definition

O artefato "ibm.yml" pode constituir evidência de configuração quando contém, de forma verificável, elementos como:

push/main
    ↓
GitHub Actions
    ↓
checkout
    ↓
IBM Cloud CLI
    ↓
IBM Cloud authentication
    ↓
IBM Container Registry
    ↓
docker build
    ↓
docker push
    ↓
kubectl apply
    ↓
rollout status

A presença desses comandos demonstra que o mecanismo está definido.

Não demonstra que os comandos tenham sido executados.

Classificação:

ibm.yml
   │
   ▼
WORKFLOW_CONFIGURATION_EVIDENCE

---

4. Execution Identity

Uma execução concreta deve possuir identidade própria.

Os seguintes elementos devem ser tratados como entidades distintas:

GITHUB_SHA
GITHUB_RUN_ID
GITHUB_RUN_ATTEMPT
WORKFLOW
JOB
RUNNER
ENVIRONMENT

Em particular:

GITHUB_SHA
    ≠
GITHUB_RUN_ID

e:

GITHUB_RUN_ID
    ≠
EXECUTION_RESULT

O commit identifica uma versão do código. O "run_id" identifica uma execução específica do workflow.

Nenhum dos dois, isoladamente, constitui prova de sucesso operacional.

---

5. Artifact Identity

Quando o workflow utiliza:

IMAGE:$GITHUB_SHA

existe uma relação declarada entre o commit e a referência da imagem:

GITHUB_SHA
    ↓
IMAGE TAG

Essa relação não deve ser confundida com uma prova de identidade imutável do artefato.

Para estabelecer identidade criptográfica do artefato, deve ser obtido o digest efetivamente associado à imagem:

IMAGE_TAG
    ↓
IMAGE_DIGEST

Portanto:

IMAGE_TAG
    ≠
IMAGE_DIGEST

O digest deve ser obtido de uma evidência operacional verificável do registry ou do runtime.

---

6. Deployment Binding

A cadeia de binding desejada é:

COMMIT
   ↓
GITHUB ACTIONS RUN
   ↓
BUILD
   ↓
IMAGE
   ↓
IMAGE DIGEST
   ↓
IBM CONTAINER REGISTRY
   ↓
IKS DEPLOYMENT
   ↓
POD
   ↓
RUNTIME

A existência dessa cadeia como configuração não é suficiente.

Cada vínculo deve ser sustentado por evidência correspondente.

---

7. Required Execution Evidence

Para classificar uma execução concreta, devem ser preservados, quando aplicáveis:

GITHUB_RUN_ID
GITHUB_RUN_ATTEMPT
GITHUB_SHA
WORKFLOW_NAME
JOB_NAME
RUNNER
EXECUTION_TIMESTAMP
BUILD_RESULT
IMAGE_REFERENCE
IMAGE_DIGEST
ICR_REPOSITORY
IMAGE_MANIFEST
PUSH_RESULT
DEPLOYMENT_REFERENCE
DEPLOYMENT_UID
POD_IMAGE_ID
ROLLOUT_RESULT
RUNTIME_STATE

A ausência de um desses elementos não deve ser preenchida por inferência.

---

8. IBM Authentication

A presença de:

IBM_CLOUD_API_KEY

ou de uma referência a secret demonstra apenas uma dependência/configuração do workflow.

Não demonstra que a autenticação ocorreu.

A distinção é:

SECRET_REFERENCE
        ≠
AUTHENTICATION_EXECUTION
        ≠
AUTHENTICATION_SUCCESS

A autenticação executada deve ser demonstrada por evidência proveniente da execução correspondente, observando os requisitos de segurança e não expondo credenciais.

---

9. IKS Cluster Identity

Valores como:

IKS_CLUSTER: example-iks-cluster-name-or-id

devem ser classificados como configuração ou placeholder enquanto não houver evidência operacional que associe a execução a um cluster concreto.

Portanto:

CLUSTER_REFERENCE
        ≠
CLUSTER_EXISTENCE_PROOF
        ≠
DEPLOYMENT_EXECUTION

---

10. Rollout Verification

A presença de:

kubectl rollout status

demonstra que o workflow contém um mecanismo para consultar o rollout.

Não demonstra que o rollout foi executado ou concluído com sucesso.

A classificação correta exige evidência do comando executado e seu resultado:

ROLLOUT_COMMAND
        ↓
EXECUTION
        ↓
RESULT

Somente o último estágio, quando devidamente vinculado à execução, pode sustentar uma afirmação sobre o resultado do rollout.

---

11. Evidence State Model

O modelo recomendado é:

E1
WORKFLOW_DEFINITION
        │
        │ ibm.yml
        ▼
E2
EXECUTION_CONTEXT
        │
        ├── repository
        ├── workflow
        ├── commit
        ├── run_id
        ├── run_attempt
        ├── runner
        └── environment
        │
        ▼
E3
ACTUAL_EXECUTION
        │
        ├── checkout
        ├── authentication
        ├── build
        ├── push
        ├── deployment
        └── rollout
        │
        ▼
E4
EXECUTION_RESULT
        │
        ├── build result
        ├── image digest
        ├── push result
        ├── deployment result
        └── rollout result
        │
        ▼
E5
ARTIFACT_BINDING
        │
        ├── commit
        ├── execution
        ├── image digest
        ├── registry artifact
        └── deployment/runtime reference
        │
        ▼
E6
INDEPENDENT_VERIFICATION
        │
        ▼
E7
CLAIM_SCOPED_VERIFIED

---

12. Claim Scope

Uma afirmação deve possuir escopo explícito.

Exemplo:

CLAIM:
Deployment X used image digest Y

não deve ser promovida automaticamente para:

CLAIM:
All deployments used image digest Y

ou:

CLAIM:
The entire IBM deployment environment is verified

A promoção de escopo exige nova avaliação e evidência correspondente.

---

13. Verification Requirements

Uma classificação "VERIFIED" requer, no mínimo, uma cadeia verificável entre:

CLAIM
  ↓
EVIDENCE
  ↓
IDENTITY
  ↓
BINDING
  ↓
INTEGRITY
  ↓
INDEPENDENT VERIFICATION

A simples presença de:

- YAML;
- comandos;
- hashes;
- tags;
- logs isolados;
- referências de registry;
- IDs;
- documentação;
- declarações de sucesso;

não deve ser interpretada isoladamente como prova de execução verificável.

---

14. Current Classification of ibm.yml

Elemento| Classificação
Workflow definition| "ESTABLISHED"
"push/main" trigger| "ESTABLISHED"
"GITHUB_SHA"| "IDENTITY_INPUT"
SHA → image tag| "ESTABLISHED_AS_DECLARED"
Docker build definition| "ESTABLISHED"
ICR push definition| "ESTABLISHED"
IKS deployment definition| "ESTABLISHED"
Rollout command definition| "ESTABLISHED"
Actual GitHub Actions execution| "NOT_DERIVED"
IBM authentication execution| "NOT_DERIVED"
Docker build execution| "NOT_DERIVED"
ICR push execution| "NOT_DERIVED"
Image digest| "NOT_DEMONSTRATED_BY_YAML"
IKS deployment execution| "NOT_DERIVED"
Rollout success| "NOT_DERIVED"
Runtime state| "NOT_DEMONSTRATED"
Independent verification| "NOT_DEMONSTRATED"
XA-TRUST VERIFIED| "NOT_PROMOTABLE_FROM_YAML_ALONE"

---

15. Separation of Artifacts

O workflow executável deve conter somente instruções destinadas à execução.

Especificações de governança, classificação e análise devem permanecer fora do workflow:

.github/workflows/ibm.yml
        │
        └── EXECUTABLE WORKFLOW

docs/governance/XA-TRUST-IBM-IKS.md
        │
        └── GOVERNANCE SPECIFICATION

Não inserir no YAML executável blocos textuais de análise, classificação ou conclusões de governança sem sintaxe YAML válida.

---

16. Governance Principle

O princípio operacional é:

WORKFLOW PRODUCES EXECUTION
        ↓
EXECUTION PRODUCES EVIDENCE
        ↓
XA-TRUST CLASSIFIES EVIDENCE
        ↓
INDEPENDENT VERIFIER VALIDATES CLAIM

Não:

WORKFLOW
   ↓
DECLARATION OF VERIFICATION

A camada de governança não deve declarar como executado aquilo que somente está definido no workflow.

---

17. Final Status

ibm.yml
    =
WORKFLOW_CONFIGURATION_EVIDENCE

NOT:

ibm.yml
    =
EXECUTION_EVIDENCE

NOT:

ibm.yml
    =
VERIFIED_DEPLOYMENT

A promoção para "CLAIM_SCOPED_VERIFIED" depende de evidência operacional concreta, binding verificável e verificação independente dentro do escopo da afirmação.

Status: "CONFIGURATION_ESTABLISHED / EXECUTION_NOT_DEMONSTRATED / VERIFIED_NOT_PROMOTED"


